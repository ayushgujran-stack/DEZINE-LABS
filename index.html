<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEZINE • Next-Gen Creative Agency & Digital Production Studio</title>
  <meta name="description" content="DEZINE is a premier creative agency specializing in high-end brand identity, scroll-driven web experiences, 3D motion graphics, and digital strategy." />

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/styles/main.css" />
  <link rel="stylesheet" href="/styles/components.css" />
  <link rel="stylesheet" href="/styles/scroll-typography.css" />
</head>
<body>

  <!-- Custom Magnetic Cursor (Trionn Style) -->
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <!-- Floating Scroll Action Button -->
  <div id="scroll-indicator-btn" class="magnetic">
    <span>Scroll</span>
    <i class="fas fa-chevron-down scroll-bounce-icon"></i>
  </div>

  <!-- Preloader Screen -->
  <div id="preloader">
    <div class="navbar-brand" style="font-size: 2.2rem;">
      <span class="brand-dot"></span> DEZINE
    </div>
    <div class="loader-bar-track">
      <div class="loader-bar-fill"></div>
    </div>
    <div id="preloader-status" style="color: var(--text-muted); font-size: 0.9rem;">Initializing sequence...</div>
  </div>

  <!-- Navigation Bar -->
  <nav class="navbar" id="navbar">
    <a href="#" class="navbar-brand magnetic">
      <span class="brand-dot"></span> DEZINE
    </a>
    <ul class="nav-links">
      <li><a href="#manifesto" class="nav-link magnetic">Manifesto</a></li>
      <li><a href="#portfolio" class="nav-link magnetic">Work</a></li>
      <li><a href="#estimator" class="nav-link magnetic">Estimator</a></li>
      <li><a href="#contact" class="nav-link magnetic">Contact</a></li>
    </ul>
    <a href="#contact" class="btn btn-primary nav-cta magnetic">Start a Project</a>
  </nav>

  <!-- Main Scroll-Driven Canvas Video Frame Sequence -->
  <main>
    <div class="scroll-sequence-container">
      
      <!-- Fixed Viewport Canvas -->
      <div class="sticky-canvas-viewport">
        <canvas id="scroll-canvas"></canvas>
        <div class="canvas-overlay-vignette"></div>
        <!-- Scroll Typography React Mount (z-index 3, synced to video progress) -->
        <div id="react-scroll-typography-root"></div>
      </div>
    </div>

    <!-- Page Sections Outside Scroll Sequence -->

    <!-- Kinetic Grid Interactive Section (Replaces Removed Core Capabilities) -->
    <section id="kinetic-grid-section">
      <div id="react-kinetic-grid-root"></div>
    </section>

    <!-- Featured Projects — Card Fan Carousel -->
    <section class="page-section" id="portfolio" style="padding-top: 2rem; padding-bottom: 2rem;">
      <div id="react-portfolio-root"></div>
    </section>


    <!-- Case Study Popup Modal -->
    <div class="modal" id="portfolio-modal">
      <div class="modal-content" id="modal-body">
        <button class="modal-close magnetic"><i class="fas fa-xmark"></i></button>
        <!-- Dynamic modal content -->
      </div>
    </div>

    <!-- Interactive Scope & Cost Estimator Section (Container Scroll Animation) -->
    <section id="estimator">
      <div id="react-estimator-root"></div>
    </section>



    <!-- Contact & Brief Submission Section -->
    <section class="page-section" id="contact" style="padding-top: 4rem; padding-bottom: 4rem; overflow: hidden;">
      <div id="react-build-something-root"></div>
    </section>

    <!-- Prototype Building Section -->
    <section class="page-section" id="prototype-building-section" style="padding-top: 2rem; padding-bottom: 4rem; text-align: center;">
      <div style="max-width: 1100px; margin: 0 auto; padding: 0 1.5rem;">
        
        <!-- Status Pill -->
        <div style="margin-bottom: 1.5rem; display: inline-flex; align-items: center; gap: 0.75rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 9999px; padding: 0.5rem 1.25rem; backdrop-filter: blur(12px);">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 10px rgba(255, 255, 255, 0.5); display: inline-block;"></span>
          <span style="font-family: var(--font-heading); font-size: 0.85rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #FFFFFF;">
            PROTOTYPE BUILDING<span class="building-dots">......</span>
          </span>
        </div>

        <!-- 3D Prototype Image Container -->
        <div style="position: relative; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 20px 50px rgba(0,0,0,0.8); background: #000000;">
          <img src="/images/prototype-building.jpg" alt="DEZINE Prototype Building" style="width: 100%; height: auto; display: block; object-fit: cover;" />
          <div style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.6) 100%);"></div>
        </div>

      </div>
    </section>

  </main>

  <!-- React Gradient Footer Mount Point -->
  <div id="react-footer-root"></div>

  <!-- Entry Scripts -->
  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/scroll-typography-mount.tsx"></script>
  <script type="module" src="/js/kinetic-mount.tsx"></script>
  <script type="module" src="/js/portfolio-mount.tsx"></script>
  <script type="module" src="/js/estimator-mount.tsx"></script>
  <script type="module" src="/js/build-something-mount.tsx"></script>
  <script type="module" src="/js/footer-mount.tsx"></script>
</body>
</html>
